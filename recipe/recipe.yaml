schema_version: 1

context:
  version: "2.9.0"
  python_min: "3.11"

package:
  name: dkx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dkx/dkx-${{ version }}.tar.gz
  sha256: 37251e874c0ebbd384dceb8b128bcc1075f9913a5406464a29302716094f7c38

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - dkx = dkx.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - jax
    - numpy >=2.1
    - scipy
    - h5py
    - netcdf4
    - matplotlib-base
    - rich >=13.0
    - solvax >=0.28.1

tests:
  - python:
      imports:
        - dkx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - dkx --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: Neoclassical transport solver with CPU/GPU and differentiable JAX workflows
  license: MIT
  license_file: LICENSE
  homepage: https://sfincs-jax.readthedocs.io/
  repository: https://github.com/uwplasma/DKX
  documentation: https://sfincs-jax.readthedocs.io/

extra:
  recipe-maintainers:
    - rogeriojorge
    - matthewfeickert
    - RKHashmani
